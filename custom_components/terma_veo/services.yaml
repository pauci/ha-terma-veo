set_temperature_for:
  target:
    entity:
      integration: terma_veo
      domain: climate
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 6
          max: 28
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      required: true
      default:
        hours: 1
      selector:
        duration:
